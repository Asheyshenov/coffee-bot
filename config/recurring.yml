development:
  # Safety net for lost Payments::ExpireInvoiceJob runs (all serving coffee shops)
  payments_sweep: &payments_sweep
    class: Payments::SweepJob
    queue: default
    schedule: every minute

production:
  payments_sweep: *payments_sweep
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
